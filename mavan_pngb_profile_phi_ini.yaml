# Pilot constrained profile at phi_ini = 0.4 (in reduced-Planck units).
# For each other value, change the THIRD entry in scf_parameters AND the
# output prefix. A useful local pilot is 0.1, 0.2, 0.4, 0.6, 0.8; it is not
# a complete scan of initial phases. Also investigate negative initial phases
# if the scientific model is not restricted to the positive branch.
# best_of tests several optimizer starts; check success and competing minima.
# Keep all other cosmological and likelihood nuisance parameters free.
# Replace this path with the extracted repository location.
theory:
  classy:
    path: /home/gabrielrodrigues/class_mavan_pngb_optimized_v3.3.4
    stop_at_error: false
    extra_args:
      N_ncdm: 1
      N_ur: 2.0308
      deg_ncdm: 1
      T_ncdm: 0.71611
      mavan_ncdm: true
      # Physical mass at z=0; this value is never shot.
      m_ncdm: 0.06
      Omega_Lambda: 0
      Omega_fld: 0
      Omega_scf: -1
      attractor_ic_scf: false
      scf_tuning_index: 1
      gauge: synchronous
      # Use 3 for exact-hierarchy validation and 2 for production chains.
      ncdm_fluid_approximation: 2
      non_linear: halofit
      # Sufficient for the listed CMB+lensing+BAO+SN likelihoods and much
      # faster than forcing the nonlinear calculation to k=20/Mpc.
      nonlinear_min_k_max: 5

likelihood:
  sn.desdovekie: null
  bao.desi_dr2: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing:
    package_install:
      github_repository: carronj/planck_PR4_lensing
      min_version: 1.0.2

params:
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.05, scale: 0.01}
    proposal: 0.005
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
  H0:
    prior: {min: 55, max: 80}
    ref: {dist: norm, loc: 67.4, scale: 1.0}
    proposal: 0.5
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.120, scale: 0.001}
    proposal: 0.0005
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.055, scale: 0.006}
    proposal: 0.003
  beta_ncdm:
    prior: {min: -1.0, max: 6.0}
    ref: {dist: norm, loc: 0.75, scale: 0.05}
    proposal: 0.05
    latex: \beta
  f_pngb:
    prior: {min: 0.3, max: 2.0}
    ref: {dist: norm, loc: 1.0, scale: 0.05}
    proposal: 0.02
    drop: true
    latex: f_{\rm PNGB}
  scf_parameters:
    value: 'lambda f_pngb: "{}, -7.0, 0.4, 0.0".format(f_pngb)'
    derived: false
  Omega_m:
    latex: \Omega_{\rm m}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  age:
    latex: '{\rm Age}/\mathrm{Gyr}'
  rs_drag:
    latex: r_{\rm drag}

sampler:
  minimize:
    method: bobyqa
    best_of: 4
    # Preserve the calibration/nuisance prior terms of the original fit.
    # This is a penalized/constrained profile, not a pure-likelihood profile.
    ignore_prior: false
output: profiles_mavan_desy5/pngb_mavan_desy5_phi_ini_0p4
resume: false
