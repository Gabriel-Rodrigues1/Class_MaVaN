# PNGB MaVaN: PolyChord production run
# DES-Dovekie + DESI DR2 + Planck CMB + PR4 lensing
#
# Model:
#   V(phi) = V0 [1 + cos(phi/f)]
#   m_nu(phi) = m_nu,0 exp[beta (phi-phi0)]
#
# Sampled cosmological/model dimensions:
#   logA, n_s, theta_s_100, omega_b, omega_cdm, tau_reio,
#   m_ncdm, beta_ncdm, scf_lambda (= f_PNGB): d = 9

theory:
  classy:
    # Point this to the modified CLASS tree if it is not installed globally.
    path: /home/gabrielrodrigues/class_mavan_models/class_mavan_pngb_phitoday
    stop_at_error: false
    extra_args:
      # One massive species representing the total neutrino mass today.
      N_ncdm: 1
      deg_ncdm: 1
      T_ncdm: 0.71611
      N_ur: 2.0308

      # pNGB scalar sector. V0 is obtained by CLASS shooting.
      Omega_Lambda: 0
      Omega_fld: 0
      Omega_scf: -1
      attractor_ic_scf: no
      scf_tuning_index: 1

      # Non-linear treatment for the likelihood combination below.
      non_linear: halofit
      nonlinear_min_k_max: 20

likelihood:
  sn.desdovekie: null
  bao.desi_dr2: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing:
    package_install:
      github_repository: carronj/planck_PR4_lensing
      min_version: 1.0.2

params:
  # Primordial spectrum
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true

  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}

  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    latex: n_\mathrm{s}

  # Background parameters
  H0:
    prior:
      min: 63
      max: 75
    ref:
      dist: norm
      loc: 67.3
      scale: 1.0

  omega_b:
    prior:
      min: 0.009
      max: 0.05
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    latex: \Omega_\mathrm{b}h^2

  omega_cdm:
    prior:
      min: 0.01
      max: 0.5
    ref:
      dist: norm
      loc: 0.120
      scale: 0.001
    latex: \Omega_\mathrm{c}h^2

  tau_reio:
    prior:
      min: 0.01
      max: 0.2
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    latex: \tau_\mathrm{reio}

  # Present-day neutrino mass. With one massive species and deg_ncdm=1,
  # m_ncdm is the sampled sum in this one-heavy-species approximation.
  m_ncdm:
    prior:
      min: 0.06
      max: 0.25
    ref:
      dist: norm
      loc: 0.1
      scale: 0.02
    latex: m_{\nu,0}\,[\mathrm{eV}]

  mnu:
    derived: 'lambda m_ncdm: m_ncdm'
    latex: \sum m_\nu\,[\mathrm{eV}]

  # Positive-coupling branch. In the pNGB branch used here this permits
  # neutrinos to be lighter in the past and can generate w_app < -1.
  beta_ncdm:
    prior:
      min: 0.0
      max: 8.0
    ref:
      dist: norm
      loc: 1.0
      scale: 0.5
    latex: \beta

  # pNGB decay scale f in reduced-Planck units. The modified CLASS input
  # exposes this as scf_lambda and inserts it in scf_parameters[0].
  scf_lambda:
    prior:
      min: 0.8
      max: 2.00
    ref:
      dist: norm
      loc: 1.0
      scale: 0.15
    latex: f_{\rm PNGB}
    drop: true

  # input.c expects: f, log10(V0), phi_ini, phi_prime_ini.
  # Only f is sampled. phi_ini=0.40 and phi_prime_ini=0 are fixed.
  # log10(V0)=-7 is the initial shooting guess; scf_tuning_index=1 tunes it.
  scf_parameters:
    value: 'lambda scf_lambda: "{}, -7.00, 0.40, 0.0".format(scf_lambda)'
    derived: false

  # Derived quantities
  Omega_m:
    latex: \Omega_\mathrm{m}

  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m}h^2

  YHe:
    latex: Y_\mathrm{P}

  z_reio:
    latex: z_\mathrm{re}

  sigma8:
    latex: \sigma_8

  s8omegamp5:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.5'
    latex: \sigma_8\Omega_\mathrm{m}^{0.5}

  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8

  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}

  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s}e^{-2\tau}

  age:
    latex: '{\rm Age}/\mathrm{Gyr}'

  rs_drag:
    latex: r_\mathrm{drag}

sampler:
  polychord:
    # Production settings for d=9. Cobaya accepts Xd notation, so these
    # correspond to 450 live points and 45 slice-sampling repeats.
    nlive: 15d
    num_repeats: 5d

    # Keep mode finding enabled: beta/f/m_nu degeneracies can be non-Gaussian.
    do_clustering: true

    # Fraction of the total evidence allowed to remain in the live points.
    # 1e-3 is a production-level stopping choice; use 0.1 for a smoke test.
    precision_criterion: 0.001

    # Let Cobaya measure the CLASS/likelihood speed hierarchy and exploit it.
    measure_speeds: true
    oversample_power: 0.4

    # Keep standard posterior/evidence products and resumability.
    boost_posterior: 0
    posteriors: true
    equals: true
    cluster_posteriors: true
    write_resume: true
    read_resume: true
    write_stats: true
    write_live: true
    write_dead: true

output: chains_poly/pngb_mavan_polychord
resume: true
