# PNGB MaVaN: DES-Dovekie + DESI DR2 + Planck CMB and PR4 lensing
# Requires Cobaya >= 3.6.2 for sn.desdovekie.

theory:
  classy:
    # Uncomment and edit if the modified classy is not installed globally:
    path: /home/gabrielrodrigues/class_mavan_models/class_mavan_pngb_phitoday
    stop_at_error: false
    extra_args:
      # One massive species representing the total neutrino mass today.
      N_ncdm: 1
      deg_ncdm: 3
      N_ur: 0.00641

      # PNGB scalar field: V(phi)=V0*[1+cos(phi/f)].
      Omega_Lambda: 0
      Omega_fld: 0
      Omega_scf: -1
      attractor_ic_scf: no
      scf_tuning_index: 1

      # Non-linear correction used by the supplied likelihood combination.
      non_linear: halofit
      nonlinear_min_k_max: 20

likelihood:
  sn.desdovekie: null
  bao.desi_dr2: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing:
    package_install:
      github_repository: carronj/planck_PR4_lensing
      min_version: 1.0.2

params:
  # Primordial spectrum
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.01
    proposal: 0.005
    latex: \log(10^{10} A_\mathrm{s})
    drop: true

  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}

  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}

  # Background parameters
  theta_s_100:
    prior:
      min: 0.5
      max: 10
    ref:
      dist: norm
      loc: 1.0416
      scale: 0.0004
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
  H0:
    latex: H_0

  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b}h^2

  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.120
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c}h^2

  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}

  # Present-day neutrino mass. Because N_ncdm=1 and deg_ncdm=3,
  # The lower bound imposes the normal-ordering floor.
  m_ncdm:
    prior:
      min: 0.06
      max: 1.667
    ref:
      dist: norm
      loc: 0.0067
      scale: 0.033
    proposal: 0.01
    latex: m_\nu
  mnu:
    derived: 'lambda m_ncdm: 3 * m_ncdm'
    latex: \sum m_\nu

  # Positive-coupling branch: phi rolls to larger values, hence neutrinos
  # are lighter in the past and the apparent EOS can cross below -1.
  beta_ncdm:
    prior:
      min: -0.6
      max: 5.0
    ref:
      dist: norm
      loc: 0.8
      scale: 0.1
    proposal: 0.09
    latex: \beta

  # PNGB decay scale in reduced-Planck units.
  scf_lambda:
    prior:
      min: 0.1
      max: 1.00
    ref:
      dist: norm
      loc: 0.50
      scale: 0.15
    proposal: 0.05
    latex: f_{\rm PNGB}
    drop: true

  # input.c expects: f, log10(V0), phi_ini, phi_prime_ini.
  # Only f is sampled here. The scalar-field initial conditions are fixed at
  # phi_ini=0.40 and phi_prime_ini=0. The second entry is only a shooting
  # guess and is tuned by scf_tuning_index=1.
  scf_parameters:
    value: 'lambda scf_lambda: "{}, -7.00, 0.40, 0.0".format(scf_lambda)'
    derived: false

  # Useful derived quantities
  Omega_m:
    latex: \Omega_\mathrm{m}

  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m}h^2

  YHe:
    latex: Y_\mathrm{P}

  z_reio:
    latex: z_\mathrm{re}

  sigma8:
    latex: \sigma_8

  s8omegamp5:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.5'
    latex: \sigma_8\Omega_\mathrm{m}^{0.5}

  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8

  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}

  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s}e^{-2\tau}

  age:
    latex: '{\rm Age}/\mathrm{Gyr}'

  rs_drag:
    latex: r_\mathrm{drag}

sampler:
  mcmc:
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    covmat: auto
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2

output: chains_mavan/pngb_mavan
resume: true
