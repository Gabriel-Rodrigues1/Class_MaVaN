_ini f# Free initial field position: phi_ini = f_pngb * theta_ini.
# A new run is required because the sampled parameter space has changed.
# Initial velocity remains zero; m_ncdm remains the mass today.
# The ref and proposal widths below are starting guesses, not tuned results.
# Check convergence across positive and negative initial angles; for example,
# also initialize some independent runs with theta_ini ref.loc = -0.4.
# Replace this path with the extracted repository location.
theory:
  classy:
    path: /home/gabrielrodrigues/class_mavan_pngb_optimized_v3.3.4
    stop_at_error: false
    extra_args:
      N_ncdm: 1
      N_ur: 2.0308
      deg_ncdm: 1
      T_ncdm: 0.71611
      mavan_ncdm: true
      # Physical mass at z=0; this value is never shot.
      m_ncdm: 0.06
      Omega_Lambda: 0
      Omega_fld: 0
      Omega_scf: -1
      attractor_ic_scf: false
      scf_tuning_index: 1
      gauge: synchronous
      # Use 3 for exact-hierarchy validation and 2 for production chains.
      ncdm_fluid_approximation: 2
      non_linear: halofit
      # Sufficient for the listed CMB+lensing+BAO+SN likelihoods and much
      # faster than forcing the nonlinear calculation to k=20/Mpc.
      nonlinear_min_k_max: 5

likelihood:
  sn.pantheonplus: null
  bao.desi_dr2: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing:
    package_install:
      github_repository: carronj/planck_PR4_lensing
      min_version: 1.0.2

params:
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.05, scale: 0.01}
    proposal: 0.005
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
  H0:
    prior: {min: 55, max: 80}
    ref: {dist: norm, loc: 67.4, scale: 1.0}
    proposal: 0.5
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.120, scale: 0.001}
    proposal: 0.0005
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.055, scale: 0.006}
    proposal: 0.003
  beta_ncdm:
    prior: {min: -10.0, max: 10.0}
    ref: {dist: norm, loc: 1.5, scale: 1.5}
    proposal: 0.05
    latex: \beta
  log_f_pngb:
    prior:
      min: -2.302585093
      max: 1.098612289
    ref:
      dist: norm
      loc: -0.510825624
      scale: 0.2
    proposal: 0.1
    drop: true
    latex: \ln f_{\rm PNGB}

  theta_ini:
    prior:
      min: 0.0
      max: 3.141592653589793
    ref:
      dist: norm
      loc: 0.7
      scale: 0.2
    proposal: 0.1
    drop: true
    latex: \theta_{\rm ini}

  scf_parameters:
    value: 'lambda log_f_pngb, theta_ini: "{:.16g}, -7.0, {:.16g}, 0.0".format(np.exp(log_f_pngb), np.exp(log_f_pngb)*theta_ini)'
    derived: false

  f_pngb:
    derived: 'lambda log_f_pngb: np.exp(log_f_pngb)'
    latex: f_{\rm PNGB}

  phi_ini:
    derived: 'lambda log_f_pngb, theta_ini: np.exp(log_f_pngb)*theta_ini'
    latex: \phi_{\rm ini}
    
  Omega_m:
    latex: \Omega_{\rm m}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  age:
    latex: '{\rm Age}/\mathrm{Gyr}'
  rs_drag:
    latex: r_{\rm drag}

sampler:
  mcmc:
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.6
    covmat: pngb_mavan_desy5_final.covmat
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    
output: chains_mavan_pplus_final/pngb_mavan_pplus_final
resume: false
