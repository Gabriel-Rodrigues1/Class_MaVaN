theory:
  classy:
    path: /home/gabrielrodrigues/class_mavan_pngb_phitoday
    ignore_obsolete: true
    extra_args:
      non linear: halofit
      nonlinear_min_k_max: 20
      N_ncdm: 1.0
      N_ur: 2.0328
      Omega_Lambda: 0
      Omega_fld: 0
      Omega_scf: -1.
      scf_tuning_index: 1
      attractor_ic_scf: no
likelihood:
  bao.desi_dr2: null
  sn.pantheon: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 50
      max: 85
    ref:
      dist: norm
      loc: 67
      scale: 2
    proposal: 2
    latex: H_0    
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  Omega_m:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  m_ncdm:
    value: 0.06
    renames: mnu
  beta_ncdm:
    prior:
      min: -0.4
      max: 2.0
    ref:
      dist: norm
      loc: 0.8
      scale: 0.1
    proposal: 0.09
    latex: \beta
  scf_lambda:
    prior:
      min: 0.1
      max: 2.0
    ref:
      dist: norm
      loc: 1.0
      scale: 0.1
    proposal: 0.09
    latex: \lambda
    drop: true
  scf_parameters:
    value: 'lambda scf_lambda: str(scf_lambda) + ", -7.0, 0.0, 0.0, 1.0, 0.0"'
    derived: false
  YHe:
    latex: Y_\mathrm{P}
  tau_reio:
    prior:
      min: 0.01
      max: 0.4
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  z_reio:
    latex: z_\mathrm{re} 
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rs_drag:
    latex: r_\mathrm{drag}
sampler:
  mcmc:
    covmat: auto
    proposal_scale: 1.9
    learn_proposal: True                   # �~F~P this is essential
    learn_proposal_Rminus1_max: 10.        # start learning even with poor convergence
    learn_proposal_Rminus1_max_early: 60.  # very tolerant in early phase5
    measure_speeds: False
    drag: False
    oversample_power: 0.4
    oversample_thin: True
    max_tries: 1000
output: mavan_pplus/pngb_pplus

